<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="CSS/style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.6.1/moment-timezone-with-data-1970-2030.min.js"></script>
    <title>World Clock</title>
  </head>
  <body>
    <div class="clockContainer">
      <h1>World Clock</h1>
      <select id="countrySelect">
        <option value="">--Select a country--</option>
        <option value="current">My current location</option>
        <option value="America/New_York">United States (New York)</option>
        <option value="Europe/London">United Kingdom (London)</option>
        <option value="Europe/Paris">France (Paris)</option>
        <option value="Asia/Tokyo">Japan (Tokyo)</option>
        <option value="Australia/Sydney">Australia (Sydney)</option>
      </select>
      <div id="all-cities">
        <div class="cities" id="new-york">
          <div>
            <h2>New York</h2>
            <div class="date"></div>
          </div>
          <div class="time"></div>
        </div>
        <div class="cities" id="london">
          <div>
            <h2>London</h2>
            <div class="date"></div>
          </div>
          <div class="time"></div>
        </div>
        <div class="cities" id="paris">
          <div>
            <h2>Paris</h2>
            <div class="date"></div>
          </div>
          <div class="time"></div>
        </div>
      </div>
    </div>
    <footer>
      This project was coded by<a
        href="https://github.com/made642"
        target="_blank"
      >
        Maridel Cañada
      </a>
      and is
      <a href="https://github.com/made642/WorldClock" target="_blank">
        on GitHub</a
      >
      and
      <a href="https://myworldclockapplication.netlify.app/" target="_blank"
        >hosted on Netlify</a
      >
    </footer>
    <script src="Javascript/index.js"></script>
  </body>
</html>
